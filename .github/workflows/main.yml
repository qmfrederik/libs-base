on:
    push:
    pull_request:

jobs:
    windows:
        name: ${{ matrix.name }}
        runs-on: windows-2019
        # don't run pull requests from local branches twice
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Windows x64 MinGW Clang gnustep-2.0
                      arch: x86_64
                      msystem: MINGW64

                    - name: Windows x64 UCRT64 Clang gnustep-2.0
                      arch: ucrt-x86_64
                      msystem: UCRT64

        defaults:
            run:
                shell: msys2 {0}
    
        steps:
        - uses: actions/checkout@v3
    
        - name: Set up MSYS2 (MinGW)
          uses: msys2/setup-msys2@v2
          with:
            msystem: ${{ matrix.msystem }}
            update: true
            install: >
                git
                make
                pkg-config
                libxml2-devel
                libxslt-devel
                libffi-devel
                libgnutls-devel
                icu-devel
                mingw-w64-${{matrix.arch}}-pkg-config
                mingw-w64-${{matrix.arch}}-libxml2
                mingw-w64-${{matrix.arch}}-libxslt
                mingw-w64-${{matrix.arch}}-libffi
                mingw-w64-${{matrix.arch}}-gnutls
                mingw-w64-${{matrix.arch}}-icu
                mingw-w64-${{matrix.arch}}-libobjc2
                mingw-w64-${{matrix.arch}}-clang
                mingw-w64-${{matrix.arch}}-lld
                mingw-w64-${{matrix.arch}}-gnustep-make
    
        - name: Build source
          run: |
            ./configure
            make && make install
    
        - name: Run tests
          continue-on-error: true
          run: |
            make check
    
        - name: Upload logs
          uses: actions/upload-artifact@v3
          if: always()
          with:
            name: Logs - ${{ matrix.name }}
            path: |
                ./config.log
                ./Tests/tests.log

    linux:
      runs-on: ubuntu-latest
      env:
        CLANG_VERSION: 23
      container:
        image: ${{ matrix.image }}
      strategy:
        fail-fast: false
        matrix:
          include:
            - name: ubuntu-26.04
              image: ubuntu:26.04
              family: ubuntu
      steps:
        - name: Add LLVM apt repository (Ubuntu)
          run: |
            apt-get update
            apt-get install -y ca-certificates curl
            install -d /etc/apt/keyrings
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/apt.llvm.org.asc
            . /etc/os-release
            echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${CLANG_VERSION} main" > /etc/apt/sources.list.d/llvm.list
        - name: Install dependencies (Ubuntu)
          run: |
            apt-get update
            apt-get install -y gobjc-13 libstdc++-13-dev clang-${CLANG_VERSION} lld-${CLANG_VERSION} curl zip unzip tar git pkg-config make python3-venv
            # The Conan profile expects /usr/bin/clang and /usr/bin/clang++
            update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${CLANG_VERSION} 100
            update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${CLANG_VERSION} 100
        - name: Check LLVM, Cmake version
          run: |
            clang --version
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Install conan
          run: |
            python3 -m venv .python3/
            .python3/bin/pip install conan==2.33.0
            .python3/bin/pip install pygit2
            .python3/bin/conan --version
        - name: Configure remote and profile
          run: |
            .python3/bin/conan remote add conan-gnustep https://gitlab.com/api/v4/projects/72962159/packages/conan
            mkdir -p  ~/.conan2/profiles/
            curl -X GET https://raw.githubusercontent.com/qmfrederik/conan-gnustep/refs/heads/main/profiles/linux-clang-nodist > ~/.conan2/profiles/default
            .python3/bin/conan profile show
        - name: Build
          run: |
            .python3/bin/conan install .
            . ./conanbuild.sh
            PKG_CONFIG_PATH=$PWD ./configure --disable-importing-config-file --disable-icu-config
            make -j$(nproc)
